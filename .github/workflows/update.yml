name: Update Shell diesel prices

on:
  schedule:
    - cron: '17 * * * *'      # every hour; the ministry updates about every 30 minutes
  workflow_dispatch: {}        # "Run workflow" button for a first run by hand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and filter the prices
        run: python3 scripts/update.py
      - name: Commit the new data
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/shell.json
          git diff --cached --quiet || git commit -m "Prices $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
